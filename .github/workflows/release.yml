name: Release

# Cut a release by pushing a version tag:
#   git tag v2.0.2 && git push origin v2.0.2
# Builds the Linux installers (.deb, .tar.gz, .AppImage) and the Windows .msi, then publishes the
# GitHub Release. CI does NOT sign or notarize: the macOS .dmg is notarized on a Mac and uploaded to
# the release afterward (see RELEASING.md). No repository secrets are required.

on:
  push:
    tags:
      - 'v*'

jobs:
  linux:
    name: deb + tarball + AppImage (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: sudo apt-get update && sudo apt-get install -y fakeroot desktop-file-utils
      - name: Build deb + portable tarball
        run: |
          chmod +x gradlew
          ./gradlew packageDeb createDistributable
          cp build/compose/binaries/main/deb/relaypony_*_amd64.deb RelayPony-linux.deb
          tar -czf RelayPony-linux-x86_64.tar.gz -C build/compose/binaries/main/app RelayPony
      - name: Build AppImage
        run: |
          APPDIR=RelayPony.AppDir
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR"
          cp -r build/compose/binaries/main/app/RelayPony/* "$APPDIR/"
          cp packaging/appimage/AppRun "$APPDIR/AppRun"
          chmod +x "$APPDIR/AppRun"
          cp packaging/appimage/relaypony.desktop "$APPDIR/relaypony.desktop"
          cp packaging/relaypony.png "$APPDIR/relaypony.png"
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run "$APPDIR" RelayPony-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            RelayPony-linux.deb
            RelayPony-linux-x86_64.tar.gz
            RelayPony-x86_64.AppImage

  linux-arm:
    name: deb + tarball + AppImage (Linux arm64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: sudo apt-get update && sudo apt-get install -y fakeroot desktop-file-utils
      - name: Build deb + portable tarball
        run: |
          chmod +x gradlew
          ./gradlew packageDeb createDistributable
          cp build/compose/binaries/main/deb/relaypony_*_arm64.deb RelayPony-linux-arm64.deb
          tar -czf RelayPony-linux-aarch64.tar.gz -C build/compose/binaries/main/app RelayPony
      - name: Build AppImage
        run: |
          APPDIR=RelayPony.AppDir
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR"
          cp -r build/compose/binaries/main/app/RelayPony/* "$APPDIR/"
          cp packaging/appimage/AppRun "$APPDIR/AppRun"
          chmod +x "$APPDIR/AppRun"
          cp packaging/appimage/relaypony.desktop "$APPDIR/relaypony.desktop"
          cp packaging/relaypony.png "$APPDIR/relaypony.png"
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-aarch64.AppImage
          chmod +x appimagetool-aarch64.AppImage
          ARCH=aarch64 ./appimagetool-aarch64.AppImage --appimage-extract-and-run "$APPDIR" RelayPony-aarch64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm
          path: |
            RelayPony-linux-arm64.deb
            RelayPony-linux-aarch64.tar.gz
            RelayPony-aarch64.AppImage

  windows:
    name: msi (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure WiX Toolset 3.x (jpackage needs candle.exe/light.exe)
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset -y --no-progress
            $wix = Get-ChildItem 'C:\Program Files (x86)' -Filter 'WiX Toolset v3*' -Directory | Select-Object -Last 1
            if ($wix) { Join-Path $wix.FullName 'bin' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8 }
          }
      - name: Build msi
        shell: pwsh
        run: |
          ./gradlew.bat packageMsi
          Copy-Item build/compose/binaries/main/msi/RelayPony-*.msi RelayPony-windows.msi
      - uses: actions/upload-artifact@v4
        with:
          name: msi
          path: RelayPony-windows.msi

  release:
    name: Publish GitHub Release
    needs: [linux, linux-arm, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            artifacts/linux/RelayPony-linux.deb \
            artifacts/linux/RelayPony-linux-x86_64.tar.gz \
            artifacts/linux/RelayPony-x86_64.AppImage \
            artifacts/linux-arm/RelayPony-linux-arm64.deb \
            artifacts/linux-arm/RelayPony-linux-aarch64.tar.gz \
            artifacts/linux-arm/RelayPony-aarch64.AppImage \
            artifacts/msi/RelayPony-windows.msi \
            --repo "${{ github.repository }}" \
            --title "RelayPony Desktop ${{ github.ref_name }}" \
            --generate-notes
