name: Release

# Cut a release by pushing a version tag:
#   git tag v2.0.1 && git push origin v2.0.1
# Builds a signed + notarized .dmg (macOS runner), a .deb (Ubuntu runner), and an .msi (Windows runner),
# renames them to the stable names the website links to, and publishes the GitHub Release.
# Requires the repository secrets documented in RELEASING.md.

on:
  push:
    tags:
      - 'v*'

jobs:
  macos:
    name: Signed + notarized dmg (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Import Developer ID certificate
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import "$RUNNER_TEMP/cert.p12" -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s build.keychain login.keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm "$RUNNER_TEMP/cert.p12"

      - name: Build and notarize dmg
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARIZATION_APPLE_ID: ${{ secrets.NOTARIZATION_APPLE_ID }}
          NOTARIZATION_PASSWORD: ${{ secrets.NOTARIZATION_PASSWORD }}
          NOTARIZATION_TEAM_ID: ${{ secrets.NOTARIZATION_TEAM_ID }}
        run: |
          chmod +x gradlew
          ./gradlew notarizeDmg -Pcompose.desktop.mac.notarization.teamID="$NOTARIZATION_TEAM_ID"
          cp build/compose/binaries/main/dmg/RelayPony-*.dmg RelayPony-macOS.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: dmg
          path: RelayPony-macOS.dmg

  linux:
    name: deb + tarball + AppImage (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: sudo apt-get update && sudo apt-get install -y fakeroot desktop-file-utils
      - name: Build deb + portable tarball
        run: |
          chmod +x gradlew
          ./gradlew packageDeb createDistributable
          cp build/compose/binaries/main/deb/relaypony_*_amd64.deb RelayPony-linux.deb
          tar -czf RelayPony-linux-x86_64.tar.gz -C build/compose/binaries/main/app RelayPony
      - name: Build AppImage
        run: |
          APPDIR=RelayPony.AppDir
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR"
          cp -r build/compose/binaries/main/app/RelayPony/* "$APPDIR/"
          cp packaging/appimage/AppRun "$APPDIR/AppRun"
          chmod +x "$APPDIR/AppRun"
          cp packaging/appimage/relaypony.desktop "$APPDIR/relaypony.desktop"
          cp packaging/relaypony.png "$APPDIR/relaypony.png"
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run "$APPDIR" RelayPony-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            RelayPony-linux.deb
            RelayPony-linux-x86_64.tar.gz
            RelayPony-x86_64.AppImage

  windows:
    name: msi (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure WiX Toolset 3.x (jpackage needs candle.exe/light.exe)
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset -y --no-progress
            $wix = Get-ChildItem 'C:\Program Files (x86)' -Filter 'WiX Toolset v3*' -Directory | Select-Object -Last 1
            if ($wix) { Join-Path $wix.FullName 'bin' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8 }
          }
      - name: Build msi
        shell: pwsh
        run: |
          ./gradlew.bat packageMsi
          Copy-Item build/compose/binaries/main/msi/RelayPony-*.msi RelayPony-windows.msi
      - uses: actions/upload-artifact@v4
        with:
          name: msi
          path: RelayPony-windows.msi

  release:
    name: Publish GitHub Release
    needs: [macos, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            artifacts/dmg/RelayPony-macOS.dmg \
            artifacts/linux/RelayPony-linux.deb \
            artifacts/linux/RelayPony-linux-x86_64.tar.gz \
            artifacts/linux/RelayPony-x86_64.AppImage \
            artifacts/msi/RelayPony-windows.msi \
            --repo "${{ github.repository }}" \
            --title "RelayPony Desktop ${{ github.ref_name }}" \
            --generate-notes
